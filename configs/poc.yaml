# Stage 1, proof of concept. Book section 4.3. Milestone M10.
#
# Subset chosen for known ground truth at both ends: two expected-authentic creations
# and three expected-suspicious ones, spanning canonical plays and the apocrypha.
#
# Prediction to write down BEFORE running: the two expected-authentic creations score
# lower than the three expected-suspicious ones, with no overlap.
#
# Scale: roughly 250 chunks x M=3, so about 750 rewrite calls.
extends: default.yaml

corpus:
  # Identifiers must match data/corpus_sources.yaml exactly. They were corrected on 2026-08-15:
  # this file was written before the corpus was assembled and named five creations that do not
  # exist, which `mmlsa run --dry-run` now refuses rather than silently running a smaller subset.
  include_ids:
    - the_tragedy_of_macbeth       # expected authentic
    - the_tragedy_of_hamlet        # expected authentic
    - king_henry_viii              # expected suspicious, consensus co-authorship with Fletcher
    - the_life_of_timon_of_athens  # expected suspicious, consensus co-authorship with Middleton
    - a_yorkshire_tragedy          # expected suspicious, apocrypha

llm:
  model_id: null           # set to a pinned dated snapshot before the run of record

run:
  M: 3
  tag: "poc"
