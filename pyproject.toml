[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mmlsa"
version = "0.1.0"
description = "Detecting misattributed creations in a literary corpus through LLM-based style normalization"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
    { name = "Eliran Melihov" },
    { name = "Miron Hanukaiev" },
]
keywords = ["stylometry", "authorship-attribution", "style-transfer", "digital-humanities"]

dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "numpy>=1.26,<2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "python-Levenshtein>=0.25",
    "scikit-image>=0.23",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "tenacity>=8.3",
    "structlog>=24.1",
]

[project.optional-dependencies]
gemini = ["google-genai>=0.3"]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.30"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "pandas-stubs",
]
all = ["mmlsa[gemini,openai,anthropic,dev]"]

[project.scripts]
mmlsa = "mmlsa.cli:app"

[project.urls]
Repository = "https://github.com/eliranmeleh/Multi-Modal-LLM-Style-Analysis"

[tool.hatch.build.targets.wheel]
packages = ["src/mmlsa"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ARG", "PTH", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "N802"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The cache provider is disabled because the working copy lives in a synced OneDrive folder, where
# pytest's atomic rename of .pytest_cache intermittently fails with a permission error. Nothing in
# the suite depends on cross-run caching.
addopts = "-q --strict-markers -p no:cacheprovider"
markers = [
    "slow: takes more than a few seconds",
    "validation: scientific validation check, needs recorded run artifacts",
]

[tool.coverage.run]
source = ["src/mmlsa"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
