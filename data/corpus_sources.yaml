# Foreign creations injected one per run from run 2 onward (docs/SPEC.md, Step 1).
#
# Chosen from the target author's contemporaries so that the intruder is a genuine test: a modern
# novel would be trivially distinguishable and would prove nothing about the method's robustness.
# Authors here are deliberately disjoint from the held-out set and the mixture sources, so that a
# profile perturbed by one author in run 2 is not later asked to judge a different text by that
# same author (docs/DATA.md section 1.1, rule 3).
#
# SIZE MATTERS HERE, and only here. A noise text is added to the corpus *before* profile
# extraction, so it is one of the inputs the profile is computed from. The specification injects
# "one different foreign creation", meaning something comparable in scale to a creation. An epic
# or a collected edition is not: The Faerie Queene at 472,000 words and The Canterbury Tales at
# 280,000 would each have been a third of the corpus on their own, and would have rewritten the
# profile rather than perturbed it, which is the opposite of what the robustness test is for.
# Every entry below is a single work between roughly 15,000 and 60,000 words, enforced by
# tests/data/test_set_disjointness.py. No such constraint applies to the held-out or mixture sets,
# which are scored rather than profiled.
noise_pool:
  - id: noise_duchess_of_malfi
    title: "The Duchess of Malfi"
    author: "John Webster"
    gutenberg_id: 2232
  - id: noise_defence_of_poesie
    title: "A Defence of Poesie and Poems"
    author: "Philip Sidney"
    gutenberg_id: 1962
  - id: noise_noble_spanish_soldier
    title: "The Noble Spanish Soldier"
    author: "Thomas Dekker"
    gutenberg_id: 16753
  - id: noise_satiro_mastix
    title: "Satiro-Mastix; or, the Vntrussing of the Humorous Poet"
    author: "Thomas Dekker"
    gutenberg_id: 49636
  - id: noise_all_for_love
    title: "All for Love; Or, The World Well Lost"
    author: "John Dryden"
    gutenberg_id: 2062
  - id: noise_james_the_fourth
    title: "The Scottish History of James the Fourth"
    author: "Robert Greene"
    gutenberg_id: 43668
  - id: noise_utopia
    title: "Utopia"
    author: "Thomas More"
    gutenberg_id: 2130
  - id: noise_lady_of_pleasure
