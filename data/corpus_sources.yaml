# The corpus, and where every text comes from.
#
# PROVENANCE. The 49 creations are the collection analysed by Volkovich and Avros (2025),
# "Comprehension of the Shakespeare authorship question through deep impostors approach",
# Digital Scholarship in the Humanities 40(1), 308-328. Their Table 4 lists all forty-nine by name.
# Using the same corpus is what makes the agreement report in Phase B meaningful, so this file is
# not a convenient set of texts: it is a reconstruction of theirs, and any deviation is recorded.
#
# THE PAPER GIVES TITLES, NOT IDENTIFIERS. It states only that the texts come from Project
# Gutenberg. The mapping from title to identifier below was therefore reconstructed, and the
# reasoning is worth stating because it is the weakest link in the comparison:
#
#   The Gutenberg catalogue holds four largely parallel Shakespeare series (the 1100s, 1500s,
#   1700s and 2200s). Only the 1500 series contains every unusual member of the paper's list -
#   Pericles, The Rape of Lucrece, The Two Noble Kinsmen, Sir Thomas More, Locrine and Mucedorus.
#   The others are missing several. The 1500 series is therefore the family the paper used, and it
#   supplies 39 of the 49. The remaining ten are works with no 1500-series entry: Venus and Adonis
#   and the nine apocryphal plays, each of which has a single Gutenberg edition.
#
# Recorded as an open question, not a settled fact. See docs/OPEN_QUESTIONS.md Q12.
#
# EDITION CONSISTENCY. Gutenberg holds genuine duplicates within the 1500 series. Where a duplicate
# exists the entry matching the series' modernized format is used, because mixing an original-quarto
# text into a modernized corpus would change function-word usage for editorial rather than authorial
# reasons, and function words are the entire measurement:
#   - The Two Noble Kinsmen: 1506 (modernized) rather than 1542 (Tucker Brooke's 1908 edition of
#     the 1634 quarto, original spelling).
#   - Much Ado about Nothing: 1519 (modernized) rather than 1520 (an older edition).
#
# LICENCE. All texts are public domain. Provenance per text is recorded in data/manifest.json.

author_label: "Shakespeare"

